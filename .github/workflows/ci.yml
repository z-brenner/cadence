name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cadence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cadence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir /tmp/wr
      - run: npm run db:migrate
      - name: Smoke test (UTC)
        run: npm run smoke
        env:
          TZ: UTC
      - name: Smoke test (Pacific/Auckland)
        run: npm run smoke
        env:
          TZ: Pacific/Auckland
      - name: Install Chromium for the UI walkthrough
        run: npx playwright install --with-deps chromium
      - name: UI walkthrough
        run: |
          npx tsx scripts/ui/serve.ts &
          sleep 3
          node scripts/ui/walkthrough.mjs shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots/
